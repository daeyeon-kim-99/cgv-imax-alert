name: CGV IMAX Monitor

on:
  schedule:
    # 백업용. 오라클 VM(monitor.py --loop, 30~60초 간격)이 주력이고,
    # 이건 오라클이 멈췄을 때만 걸리는 안전망이라 촘촘할 필요 없음.
    - cron: "*/30 * * * *"
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # state.json 커밋용

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests
      
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit state (dedup)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "update state" && git push
